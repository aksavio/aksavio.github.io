</head>
<body>
    <h2 style="text-align:center">Andaman</h2>
    <center>
        <div class="container">
            <div class="mySlides">
                <div class="numbertext">1 / 12</div>
                <img src="assets/andaman/1.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">2 / 12</div>
                <img src="assets/andaman/2.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">3 / 12</div>
                <img src="assets/andaman/3.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">4 / 12</div>
                <img src="assets/andaman/4.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">5 / 12</div>
                <img src="assets/andaman/5.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">6 / 12</div>
                <img src="assets/andaman/6.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">7 / 12</div>
                <img src="assets/andaman/7.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">8 / 12</div>

            </div>
            <div class="mySlides">

            <div class="mySlides">
                <div class="numbertext">10 / 12</div>
                <img src="assets/andaman/10.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">11 / 12</div>
                <img src="assets/andaman/11.jpg" style="width:65%">
            </div>
            <div class="mySlides">
                <div class="numbertext">12 / 12</div>
                <img src="assets/andaman/12.jpg" style="width:65%">
            </div>
            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>
        </center>
        <script>
            var slideIndex = 1;
            showSlides(slideIndex);
            function plusSlides(n) {
            showSlides(slideIndex += n);
            }
            function currentSlide(n) {
            showSlides(slideIndex = n);
            }
            function showSlides(n) {
            var i;
            var slides = document.getElementsByClassName("mySlides");
            var dots = document.getElementsByClassName("demo");
            var captionText = document.getElementById("caption");
            if (n > slides.length) {slideIndex = 1}
            if (n < 1) {slideIndex = slides.length}
            for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
            }
            for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex-1].style.display = "block";
            dots[slideIndex-1].className += " active";
            captionText.innerHTML = dots[slideIndex-1].alt;
            }
        </script>
</body>
</html>
